<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Slide Studio!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
    body {
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
      min-height: 100vh;
      color: #fff;
      text-align: center;
      background: linear-gradient(120deg, #7a2cff, #ff5fa2, #ffd76b);
      background-size: 300% 300%;
      animation: flow 14s ease infinite;
      padding: 16px 12px 40px;
    }
    @keyframes flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 { font-size: clamp(1.5rem, 6vw, 2.2rem); text-shadow: 3px 3px 0 rgba(0,0,0,0.3); }
    .sub { font-size: clamp(0.8rem, 3vw, 1rem); margin: 4px 0 12px; opacity: 0.9; }

    .btn {
      font-family: inherit; font-weight: bold; font-size: 0.95rem; color: #4a1e6e;
      background: #ffd76b; border: 3px solid #fff; border-radius: 18px;
      padding: 9px 16px; margin: 4px; cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,0.3);
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.wide { display: block; width: 100%; max-width: 400px; margin: 10px auto 0; font-size: 1.1rem; }
    .btn.danger { background: #ff8080; }

    #appWrap { max-width: 420px; margin: 0 auto; }

    #topBar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #menuBtn { font-size: 0.85rem; padding: 7px 12px; }
    #projectNameLabel {
      flex: 1; font-weight: bold; font-size: 0.95rem; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
      border-bottom: 2px dashed rgba(255,255,255,0.5);
    }

    #slideStageWrap {
      width: 100%; aspect-ratio: 4 / 3; position: relative;
      border: 5px solid #fff; border-radius: 16px; overflow: hidden;
      background: #333; margin-bottom: 8px;
    }
    #bgTypeBtn {
      position: absolute; top: 8px; left: 8px; z-index: 5;
      font-size: 0.75rem; padding: 6px 10px; margin: 0;
      background: rgba(0,0,0,0.45); color: #fff; border: 2px solid #fff;
      box-shadow: none;
    }
    #slideCanvas, .slideBgImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .textBoxEl {
      position: absolute; transform: translate(-50%, -50%);
      font-family: inherit; font-weight: bold; white-space: pre-wrap; text-align: center;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
      cursor: grab; padding: 2px 6px; max-width: 90%;
    }

    #toolRow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; margin-bottom: 8px; }
    #toolRow .btn { font-size: 0.82rem; padding: 8px 10px; }
    .durationRow {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.14); border: 3px solid #fff; border-radius: 14px;
      padding: 6px 10px; font-size: 0.82rem; font-weight: bold;
    }
    #durationInput {
      width: 52px; font-family: inherit; font-size: 0.85rem; font-weight: bold; text-align: center;
      padding: 4px 2px; border-radius: 8px; border: 2px solid #fff;
      background: rgba(255,255,255,0.95); color: #2a1a3e;
    }

    #slideFilmstrip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; }
    .slideThumb {
      flex-shrink: 0; width: 56px; height: 42px; border-radius: 8px;
      border: 3px solid rgba(255,255,255,0.5); position: relative; cursor: pointer;
      background-size: cover; background-position: center; overflow: hidden; padding: 0;
    }
    .slideThumb.active { border-color: #fff; box-shadow: 0 0 0 2px #ffd76b; }
    .slideThumb img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .thumbNum {
      position: absolute; bottom: 1px; left: 3px; font-size: 0.6rem; font-weight: bold;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
    }
    .thumbBadge { position: absolute; top: 1px; right: 2px; font-size: 0.55rem; text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
    .slideThumb.addThumb {
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      background: rgba(255,255,255,0.15);
    }

    /* ---- overlays ---- */
    #bgPickerOverlay, #drawOverlay, #textEditOverlay, #bgTypeOverlay, #photoSearchOverlay, #menuOverlay, #projectNameOverlay {
      display: none; position: fixed; inset: 0; z-index: 50;
      align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      background: rgba(20, 10, 30, 0.92); padding: 16px; overflow-y: auto;
    }
    #bgPickerGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 340px; }
    .bgSwatch { height: 52px; border-radius: 10px; border: 3px solid #fff; cursor: pointer; padding: 0; }
    .bgSwatch:hover, .photoThumbBtn:hover { outline: 3px solid #ffd76b; outline-offset: 2px; }

    #bgTypeOverlay .btn { width: 100%; max-width: 280px; font-size: 1rem; padding: 14px; }

    #photoSearchRow { display: flex; gap: 6px; width: 100%; max-width: 360px; }
    #photoSearchInput {
      flex: 1; font-family: inherit; font-size: 1rem; padding: 9px 12px;
      border-radius: 12px; border: 3px solid #fff; background: rgba(255,255,255,0.95); color: #2a1a3e;
    }
    #photoSearchStatus { font-size: 0.85rem; min-height: 1.3em; opacity: 0.9; }
    #photoResultsGrid, #recentPhotosRow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 360px; }
    #recentPhotosRow { grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); overflow-x: auto; }
    .photoThumbBtn {
      aspect-ratio: 1; border-radius: 10px; border: 3px solid #fff; padding: 0; cursor: pointer;
      background-size: cover; background-position: center; overflow: hidden;
    }
    #recentPhotosLabel { font-size: 0.8rem; opacity: 0.85; margin-top: 6px; }

    #menuProjectList { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 360px; }
    .menuProjectRow {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.1); border-radius: 12px; padding: 6px;
      border: 2px solid transparent;
    }
    .menuProjectRow.active { border-color: #ffd76b; }
    .menuProjectThumb {
      width: 46px; height: 34px; border-radius: 6px; flex-shrink: 0; cursor: pointer;
      background-size: cover; background-position: center; overflow: hidden; position: relative;
    }
    .menuProjectThumb img { width: 100%; height: 100%; object-fit: cover; }
    .menuProjectName { flex: 1; text-align: left; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
    .menuDeleteBtn { background: none; border: none; color: #ffb0b0; font-size: 1.1rem; cursor: pointer; padding: 4px; }

    #projectNameInput {
      font-family: inherit; font-size: 1.1rem; font-weight: bold; text-align: center;
      padding: 10px; border-radius: 12px; border: 3px solid #fff; width: 90%; max-width: 300px;
      background: rgba(255,255,255,0.95); color: #2a1a3e;
    }

    #drawSurfaceWrap { width: 100%; max-width: 360px; aspect-ratio: 4/3; border: 4px solid #fff; border-radius: 12px; overflow: hidden; }
    #drawSurface { width: 100%; height: 100%; display: block; touch-action: none; }
    .colorRow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .colorSwatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); cursor: pointer; padding: 0; }
    .colorSwatch.selected { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 0 2px #ffd76b; }
    .sizeRow { display: flex; gap: 8px; }
    .sizeBtn { font-family: inherit; font-weight: bold; color: #fff; background: rgba(255,255,255,0.15); border: 3px solid #fff; border-radius: 12px; padding: 6px 12px; cursor: pointer; }
    .sizeBtn.selected { background: rgba(255,215,107,0.5); }

    #textEditInput {
      font-family: inherit; font-size: 1.1rem; font-weight: bold; text-align: center;
      padding: 10px; border-radius: 12px; border: 3px solid #fff; width: 90%; max-width: 320px;
      background: rgba(255,255,255,0.95); color: #2a1a3e;
    }

    /* ---- player ---- */
    #playerScreen {
      display: none; position: fixed; inset: 0; z-index: 100; background: #000; overflow: hidden;
    }
    /* Transition animation itself is driven by explicit inline styles set from JS (see
       applyStandardTransition) rather than CSS classes - two-class selectors like .trans-slide.incoming
       and .playerSlide.active have identical specificity, which made the wrong one win depending on
       source order alone. These two rules just define the settled (non-animating) resting state. */
    .playerSlide { position: absolute; inset: 0; opacity: 0; z-index: 1; }
    .playerSlide.active { opacity: 1; z-index: 2; }
    .playerSlide .textBoxEl { cursor: default; }
    #exitPlayBtn {
      position: fixed; top: 14px; right: 14px; z-index: 10;
      background: rgba(255,255,255,0.2); color: #fff; border: 3px solid #fff; border-radius: 50%;
      width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎬 Slide Studio</h1>
  <p class="sub">Pick or draw a background, add text, then play your slideshow!</p>

  <div id="appWrap">
    <div id="topBar">
      <button class="btn" id="menuBtn">☰ Menu</button>
      <span id="projectNameLabel"></span>
    </div>
    <div id="slideStageWrap">
      <button class="btn" id="bgTypeBtn">🖼️ Background</button>
      <div id="slideCanvas"></div>
    </div>
    <div id="toolRow">
      <button class="btn" id="addTextBtn">🔤 Add Text</button>
      <button class="btn" id="transitionBtn">🎞️ Fade</button>
      <div class="durationRow" id="durationRow" title="Type a number, or press the left arrow key to switch between seconds and milliseconds">
        <span>⏱️</span>
        <input type="number" id="durationInput" min="0" step="1" inputmode="numeric">
        <span id="durationUnitLabel">sec</span>
      </div>
      <button class="btn danger" id="deleteSlideBtn">🗑️ Delete Slide</button>
    </div>
    <div id="slideFilmstrip"></div>
    <button class="btn wide" id="playBtn">▶️ Play Slideshow</button>
  </div>

  <div id="bgTypeOverlay">
    <div style="font-weight:bold;">🖼️ Pick a Background</div>
    <button class="btn" id="bgTypeColorsBtn">🎨 Colors &amp; Gradients</button>
    <button class="btn" id="bgTypeDrawBtn">✏️ Draw It Myself</button>
    <button class="btn" id="bgTypePhotoBtn">🌐 Search a Photo</button>
    <button class="btn" id="bgTypeCloseBtn">✖ Close</button>
  </div>

  <div id="menuOverlay">
    <div style="font-weight:bold;">☰ My Slideshows</div>
    <div id="menuProjectList"></div>
    <button class="btn" id="menuNewProjectBtn">➕ New Slideshow</button>
    <button class="btn" id="menuCloseBtn">✖ Close</button>
  </div>

  <div id="projectNameOverlay">
    <div style="font-weight:bold;" id="projectNameOverlayTitle">Name Your Slideshow</div>
    <input type="text" id="projectNameInput" maxlength="30" placeholder="My Slideshow">
    <div>
      <button class="btn" id="projectNameCancelBtn">✖ Cancel</button>
      <button class="btn" id="projectNameSaveBtn">✅ Save</button>
    </div>
  </div>

  <div id="photoSearchOverlay">
    <div style="font-weight:bold;">🌐 Search a Photo</div>
    <div id="photoSearchRow">
      <input type="text" id="photoSearchInput" maxlength="40" placeholder="Try: puppy, ocean, rainbow...">
      <button class="btn" id="photoSearchGoBtn">🔍</button>
    </div>
    <div id="photoSearchStatus"></div>
    <div id="photoResultsGrid"></div>
    <div id="recentPhotosLabel">🕒 Recently Used</div>
    <div id="recentPhotosRow"></div>
    <button class="btn" id="photoSearchCloseBtn">✖ Close</button>
  </div>

  <div id="bgPickerOverlay">
    <div style="font-weight:bold;">🎨 Pick a Background</div>
    <div id="bgPickerGrid"></div>
    <button class="btn" id="bgPickerCloseBtn">✖ Close</button>
  </div>

  <div id="drawOverlay">
    <div style="font-weight:bold;">✏️ Draw Your Background</div>
    <div id="drawSurfaceWrap"><canvas id="drawSurface"></canvas></div>
    <div class="colorRow" id="drawColorRow"></div>
    <div class="sizeRow" id="drawSizeRow"></div>
    <div>
      <button class="btn" id="drawClearBtn">🧹 Clear</button>
      <button class="btn" id="drawCancelBtn">✖ Cancel</button>
      <button class="btn" id="drawDoneBtn">✅ Done</button>
    </div>
  </div>

  <div id="textEditOverlay">
    <div style="font-weight:bold;">🔤 Edit Text</div>
    <input type="text" id="textEditInput" maxlength="60" placeholder="Type here!">
    <div class="colorRow" id="textColorRow"></div>
    <div class="sizeRow" id="textSizeRow"></div>
    <div>
      <button class="btn danger" id="textDeleteBtn">🗑️ Delete</button>
      <button class="btn" id="textDoneBtn">✅ Done</button>
    </div>
  </div>

  <div id="playerScreen">
    <button id="exitPlayBtn">✖</button>
    <div class="playerSlide" id="playerStageA"></div>
    <div class="playerSlide" id="playerStageB"></div>
  </div>

  <script>
    var BACKGROUND_PRESETS = [
      { id: "sky", css: "linear-gradient(180deg,#6ec6ff,#ffffff)" },
      { id: "sunset", css: "linear-gradient(180deg,#ff7e5f,#feb47b)" },
      { id: "forest", css: "linear-gradient(180deg,#2e7d32,#a5d6a7)" },
      { id: "night", css: "linear-gradient(180deg,#0d1b3e,#3949ab)" },
      { id: "candy", css: "linear-gradient(135deg,#ff9a9e,#fecfef)" },
      { id: "ocean", css: "linear-gradient(180deg,#0077be,#90e0ef)" },
      { id: "sand", css: "linear-gradient(180deg,#e8c98a,#f5deb3)" },
      { id: "space", css: "linear-gradient(180deg,#0b1d4d,#4b2e83)" },
      { id: "red", css: "#ff5f5f" },
      { id: "yellow", css: "#ffd76b" },
      { id: "green", css: "#5fd97a" },
      { id: "purple", css: "#b26bff" },
      { id: "white", css: "#ffffff" },
      { id: "black", css: "#222222" }
    ];
    var TEXT_COLORS = ["#ffffff", "#000000", "#ff5f5f", "#ffd76b", "#5fd97a", "#3fd0ff", "#b26bff", "#ff8fd6"];
    var TEXT_SIZES = { small: 18, medium: 28, large: 42 };
    var TEXT_SIZE_ORDER = ["small", "medium", "large"];
    var BRUSH_SIZES = { thin: 3, medium: 8, thick: 16 };
    var BRUSH_SIZE_ORDER = ["thin", "medium", "thick"];
    var TRANSITIONS = ["none", "fade", "slide", "zoom", "dissolve"];
    var TRANSITION_LABELS = { none: "✋ None", fade: "🌫️ Fade", slide: "➡️ Slide", zoom: "🔍 Zoom", dissolve: "🧩 Dissolve" };
    var PLAYER_ADVANCE_MS = 4000;
    var PLAYER_TRANSITION_MS = 600;
    var DISSOLVE_COLS = 8;
    var DISSOLVE_ROWS = 6;
    var DISSOLVE_TOTAL_MS = 900;
    var DISSOLVE_TICK_MS = 40;

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    var PROJECTS_STORAGE_KEY = "slideStudioProjects";
    var RECENT_PHOTOS_STORAGE_KEY = "slideStudioRecentPhotos";
    var MAX_RECENT_PHOTOS = 10;

    var slides = [];
    var slideIdCounter = 0;
    var textIdCounter = 0;
    var currentSlideIndex = 0;
    var editingTextId = null;

    var projects = [];
    var projectIdCounter = 0;
    var currentProjectId = null;
    var recentPhotos = [];

    function removeById(arr, id) {
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].id === id) { arr.splice(i, 1); return; }
      }
    }
    function findById(arr, id) {
      for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
      return null;
    }

    function makeSlide() {
      slideIdCounter++;
      return { id: "s" + slideIdCounter, background: { type: "color", value: BACKGROUND_PRESETS[0].css }, texts: [], transition: "fade", duration: PLAYER_ADVANCE_MS };
    }
    function currentSlide() { return slides[currentSlideIndex]; }

    function addSlide() {
      slides.push(makeSlide());
      currentSlideIndex = slides.length - 1;
      renderAll();
      persistProject();
    }
    function deleteCurrentSlide() {
      if (slides.length <= 1) return;
      slides.splice(currentSlideIndex, 1);
      currentSlideIndex = Math.max(0, currentSlideIndex - 1);
      renderAll();
      persistProject();
    }

    // ---------------- projects (saved slideshows) ----------------
    function makeProject(name) {
      projectIdCounter++;
      return { id: "p" + projectIdCounter + "_" + Date.now(), name: name || "My Slideshow", slides: [makeSlide()], updatedAt: Date.now() };
    }
    function loadProjectsFromStorage() {
      try {
        var raw = window.localStorage.getItem(PROJECTS_STORAGE_KEY);
        projects = raw ? JSON.parse(raw) : [];
      } catch (e) { projects = []; }
      if (!Array.isArray(projects)) projects = [];
      var maxId = 0;
      projects.forEach(function (p) {
        (p.slides || []).forEach(function (s) {
          var n = parseInt(String(s.id).replace("s", ""), 10);
          if (!isNaN(n) && n > maxId) maxId = n;
        });
      });
      slideIdCounter = maxId;
    }
    function saveProjectsToStorage() {
      try { window.localStorage.setItem(PROJECTS_STORAGE_KEY, JSON.stringify(projects)); } catch (e) {}
    }
    function persistProject() {
      if (!currentProjectId) return;
      var proj = findById(projects, currentProjectId);
      if (!proj) return;
      proj.slides = slides;
      proj.updatedAt = Date.now();
      saveProjectsToStorage();
    }
    function loadProject(id) {
      var proj = findById(projects, id);
      if (!proj) return;
      currentProjectId = id;
      slides = proj.slides;
      currentSlideIndex = 0;
      document.getElementById("projectNameLabel").textContent = proj.name;
      renderAll();
    }
    function createNewProject(name) {
      var proj = makeProject(name);
      projects.push(proj);
      saveProjectsToStorage();
      loadProject(proj.id);
    }
    function renameProject(id, name) {
      var proj = findById(projects, id);
      if (!proj || !name || !name.trim()) return;
      proj.name = name.trim();
      saveProjectsToStorage();
      if (id === currentProjectId) document.getElementById("projectNameLabel").textContent = proj.name;
    }
    function deleteProject(id) {
      if (projects.length <= 1) return;
      var wasCurrent = id === currentProjectId;
      removeById(projects, id);
      saveProjectsToStorage();
      if (wasCurrent) loadProject(projects[0].id);
      renderMenuProjectList();
    }

    // ---------------- menu overlay (all saved slideshows) ----------------
    function openMenu() {
      renderMenuProjectList();
      document.getElementById("menuOverlay").style.display = "flex";
    }
    function closeMenu() { document.getElementById("menuOverlay").style.display = "none"; }
    function renderMenuProjectList() {
      var list = document.getElementById("menuProjectList");
      list.innerHTML = "";
      projects.forEach(function (p) {
        var row = document.createElement("div");
        row.className = "menuProjectRow" + (p.id === currentProjectId ? " active" : "");
        var thumb = document.createElement("div");
        thumb.className = "menuProjectThumb";
        var firstSlide = p.slides[0];
        if (firstSlide) {
          if (firstSlide.background.type === "draw" || firstSlide.background.type === "photo") {
            var img = document.createElement("img");
            img.src = firstSlide.background.value;
            thumb.appendChild(img);
          } else {
            thumb.style.background = firstSlide.background.value;
          }
        }
        thumb.addEventListener("click", function () { closeMenu(); loadProject(p.id); });
        row.appendChild(thumb);
        var label = document.createElement("span");
        label.className = "menuProjectName";
        label.textContent = p.name + " (" + p.slides.length + ")";
        label.addEventListener("click", function () { closeMenu(); loadProject(p.id); });
        row.appendChild(label);
        var del = document.createElement("button");
        del.className = "menuDeleteBtn";
        del.textContent = "🗑️";
        del.disabled = projects.length <= 1;
        del.addEventListener("click", function (e) { e.stopPropagation(); deleteProject(p.id); });
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    // ---------------- project name overlay (used for both "new" and "rename") ----------------
    var projectNameOverlayMode = "new";
    function openNewProjectOverlay() {
      projectNameOverlayMode = "new";
      document.getElementById("projectNameOverlayTitle").textContent = "Name Your Slideshow";
      document.getElementById("projectNameInput").value = "";
      document.getElementById("projectNameOverlay").style.display = "flex";
    }
    function openRenameProjectOverlay() {
      projectNameOverlayMode = "rename";
      document.getElementById("projectNameOverlayTitle").textContent = "Rename Slideshow";
      document.getElementById("projectNameInput").value = findById(projects, currentProjectId).name;
      document.getElementById("projectNameOverlay").style.display = "flex";
    }
    function closeProjectNameOverlay() { document.getElementById("projectNameOverlay").style.display = "none"; }
    function saveProjectNameOverlay() {
      var name = document.getElementById("projectNameInput").value.trim();
      if (!name) return;
      if (projectNameOverlayMode === "new") createNewProject(name);
      else renameProject(currentProjectId, name);
      closeProjectNameOverlay();
    }

    // ---------------- recently used photos ----------------
    function loadRecentPhotosFromStorage() {
      try {
        var raw = window.localStorage.getItem(RECENT_PHOTOS_STORAGE_KEY);
        recentPhotos = raw ? JSON.parse(raw) : [];
      } catch (e) { recentPhotos = []; }
      if (!Array.isArray(recentPhotos)) recentPhotos = [];
    }
    function saveRecentPhotosToStorage() {
      try { window.localStorage.setItem(RECENT_PHOTOS_STORAGE_KEY, JSON.stringify(recentPhotos)); } catch (e) {}
    }
    function addRecentPhoto(photo) {
      recentPhotos = recentPhotos.filter(function (p) { return p.url !== photo.url; });
      recentPhotos.unshift(photo);
      if (recentPhotos.length > MAX_RECENT_PHOTOS) recentPhotos.length = MAX_RECENT_PHOTOS;
      saveRecentPhotosToStorage();
    }
    function selectSlide(idx) {
      if (idx < 0 || idx >= slides.length) return;
      currentSlideIndex = idx;
      renderAll();
    }

    // ---------------- text boxes ----------------
    function addTextBox() {
      textIdCounter++;
      var t = { id: "t" + textIdCounter, content: "Type here!", x: 50, y: 50, color: "#ffffff", size: "medium" };
      currentSlide().texts.push(t);
      renderEditorSlide();
      openTextEditor(t.id);
    }
    function updateTextPosition(id, x, y) {
      var t = findById(currentSlide().texts, id);
      if (!t) return;
      t.x = Math.max(5, Math.min(95, x));
      t.y = Math.max(5, Math.min(95, y));

    // ---------------- rendering ----------------
    function renderSlideInto(container, slide, interactive) {
      container.innerHTML = "";
      if (slide.background.type === "draw" || slide.background.type === "photo") {
        var img = document.createElement("img");
        img.className = "slideBgImg";
        img.src = slide.background.value;
        container.appendChild(img);
        container.style.background = "";
      } else {
        container.style.background = slide.background.value;
      }
      slide.texts.forEach(function (t) {
        var box = document.createElement("div");
        box.className = "textBoxEl";
        box.textContent = t.content;
        box.style.left = t.x + "%";
        box.style.top = t.y + "%";
        box.style.color = t.color;
        box.style.fontSize = TEXT_SIZES[t.size] + "px";
        container.appendChild(box);
        if (interactive) makeTextBoxDraggable(box, t, container);
      });
    }
    function makeTextBoxDraggable(el, textObj, stageEl) {
      var dragging = false, moved = false, startX = 0, startY = 0;
      el.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        dragging = true; moved = false;
        startX = e.clientX; startY = e.clientY;
        if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
      });
      el.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        if (Math.abs(e.clientX - startX) > 4 || Math.abs(e.clientY - startY) > 4) moved = true;
        var rect = stageEl.getBoundingClientRect();
        var xPct = ((e.clientX - rect.left) / rect.width) * 100;
        var yPct = ((e.clientY - rect.top) / rect.height) * 100;
        updateTextPosition(textObj.id, xPct, yPct);
        el.style.left = textObj.x + "%";
        el.style.top = textObj.y + "%";
      });
      el.addEventListener("pointerup", function () {
        dragging = false;
        if (!moved) openTextEditor(textObj.id);
        else persistProject();
      });
    }

    function canvasPoint(e, canvas) {

    // ---------------- slide duration (how long this slide stays up in the player) ----------------
    // Typed directly as a number of seconds by default; pressing the left-arrow key while the
    // input is focused flips the unit to milliseconds (and back again on a second press), taking
    // over that key's normal cursor-move behavior so it always acts as the unit toggle.
    var durationUnitIsMs = false;
    // Must stay comfortably above the longest transition (dissolve, DISSOLVE_TOTAL_MS=900ms) —
    // a duration shorter than the transition itself makes advanceSlideshow() fire again before
    // the in-flight transition finishes, stomping its classes/z-index mid-animation so slides
    // just jump with no visible animation at all.
    var MIN_SLIDE_DURATION_MS = 1000;
    function currentDurationInputMs() {
      var v = parseFloat(document.getElementById("durationInput").value);
      if (isNaN(v) || v < 0) v = 0;
      var ms = Math.round(durationUnitIsMs ? v : v * 1000);
      return Math.max(MIN_SLIDE_DURATION_MS, ms);
    }
    function renderDurationInput() {
      var ms = currentSlide().duration || PLAYER_ADVANCE_MS;
      document.getElementById("durationInput").value = durationUnitIsMs ? ms : ms / 1000;
      document.getElementById("durationUnitLabel").textContent = durationUnitIsMs ? "ms" : "sec";
    }

    // ---------------- transitions ----------------
    function cycleTransition() {
      var s = currentSlide();
      var idx = TRANSITIONS.indexOf(s.transition);
      s.transition = TRANSITIONS[(idx + 1) % TRANSITIONS.length];
      document.getElementById("transitionBtn").textContent = "🎞️ " + TRANSITION_LABELS[s.transition];
      persistProject();
    }

    // ---------------- slideshow player ----------------
    var playerIndex = 0;
    var playerActiveIsA = true;
    var playerTimer = null;

    function startSlideshow() {
      playerIndex = 0;
      playerActiveIsA = true;
      var stageA = document.getElementById("playerStageA");
      var stageB = document.getElementById("playerStageB");
      renderSlideInto(stageA, slides[0], false);
      stageA.className = "playerSlide active";
      stageA.style.zIndex = ""; stageA.style.webkitMaskImage = ""; stageA.style.maskImage = "";
      stageB.className = "playerSlide";
      stageB.style.zIndex = ""; stageB.style.webkitMaskImage = ""; stageB.style.maskImage = "";
      document.getElementById("playerScreen").style.display = "block";
      schedulePlayerAdvance();
    }
    function schedulePlayerAdvance() {
      if (playerTimer) clearTimeout(playerTimer);
      var dur = (slides[playerIndex] && slides[playerIndex].duration) || PLAYER_ADVANCE_MS;
      dur = Math.max(MIN_SLIDE_DURATION_MS, dur); // safety net for any duration saved before this floor existed
      playerTimer = setTimeout(advanceSlideshow, dur);
    }
    // "Dissolve": random little squares of the outgoing slide reveal the incoming slide underneath,
    // one by one, until the whole screen has become the next slide. Built with a canvas-generated
    // black/white mask (white = outgoing tile still showing, black = revealed) applied via CSS
    // mask-image, so it works on the real DOM (background + text) without needing to redraw text.
    function runDissolveTransition(outgoingEl, incomingEl, onDone) {
      var maskCanvas = document.createElement("canvas");
      maskCanvas.width = 400; maskCanvas.height = 300;
      var mctx = maskCanvas.getContext("2d");
      mctx.fillStyle = "#fff";
      mctx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);

      var tileW = maskCanvas.width / DISSOLVE_COLS;
      var tileH = maskCanvas.height / DISSOLVE_ROWS;
      var tiles = [];
      for (var r = 0; r < DISSOLVE_ROWS; r++) {
        for (var c = 0; c < DISSOLVE_COLS; c++) tiles.push({ c: c, r: r });
      }
      tiles = shuffle(tiles);

      outgoingEl.style.webkitMaskRepeat = "no-repeat";
      outgoingEl.style.maskRepeat = "no-repeat";
      outgoingEl.style.webkitMaskSize = "100% 100%";
      outgoingEl.style.maskSize = "100% 100%";

      var idx = 0;
      var batchSize = Math.max(1, Math.round(tiles.length / (DISSOLVE_TOTAL_MS / DISSOLVE_TICK_MS)));
      function revealNextBatch() {
        for (var i = 0; i < batchSize && idx < tiles.length; i++, idx++) {
          var t = tiles[idx];
          mctx.fillStyle = "#000";
          mctx.fillRect(t.c * tileW, t.r * tileH, tileW, tileH);
        }
        var dataUrl = maskCanvas.toDataURL();
        outgoingEl.style.webkitMaskImage = "url(" + dataUrl + ")";
        outgoingEl.style.maskImage = "url(" + dataUrl + ")";
        if (idx < tiles.length) {
          setTimeout(revealNextBatch, DISSOLVE_TICK_MS);
        } else {
          outgoingEl.style.webkitMaskImage = "";
          outgoingEl.style.maskImage = "";
          if (onDone) onDone();
        }
      }
      revealNextBatch();
    }
    // Drives none/fade/slide/zoom entirely through explicit inline styles (not CSS classes), so
    // there's no specificity cascade to get wrong: set the pre-animation "start" state, force a
    // reflow to commit it, then set the "end" state with a transition duration attached.
    function applyStandardTransition(transitionType, incomingEl, outgoingEl) {
      if (transitionType === "none") {
        // A true hard cut: skip the shared "start state -> forced reflow -> animated end state"
        // dance entirely (used by fade/slide/zoom below) so there's never a live opacity flip a
        // browser could paint as an intermediate frame — just one atomic class swap. Clearing the
        // inline opacity (instead of setting it to an explicit 0/1) also means nothing is left
        // behind to interfere with a dissolve transition on a later slide.
        [incomingEl, outgoingEl].forEach(function (el) {
          el.style.transition = "none";
          el.style.transform = "none";
          el.style.opacity = "";
          el.style.zIndex = "";
        });
        incomingEl.className = "playerSlide active";
        outgoingEl.className = "playerSlide";
        return;
      }

      [incomingEl, outgoingEl].forEach(function (el) {
        el.className = "playerSlide";
        el.style.transition = "none";
        el.style.transform = "none";
        el.style.opacity = "1";
      });
      incomingEl.style.zIndex = "2";
      outgoingEl.style.zIndex = "1";

      if (transitionType === "fade") {
        incomingEl.style.opacity = "0";
      } else if (transitionType === "slide") {
        incomingEl.style.transform = "translateX(100%)";
      } else if (transitionType === "zoom") {
        incomingEl.style.opacity = "0";
        incomingEl.style.transform = "scale(0.4)";
      }

      if (incomingEl.offsetWidth) { /* force reflow: commit the start state above before animating to the end state */ }

      var durStyle = (PLAYER_TRANSITION_MS / 1000) + "s ease";
      incomingEl.style.transition = "opacity " + durStyle + ", transform " + durStyle;
      outgoingEl.style.transition = "opacity " + durStyle + ", transform " + durStyle;
      incomingEl.style.opacity = "1";
      incomingEl.style.transform = "none";
      if (transitionType === "fade" || transitionType === "zoom") {
        outgoingEl.style.opacity = "0";
      } else if (transitionType === "slide") {
        outgoingEl.style.transform = "translateX(-100%)";
      }

      setTimeout(function () { finishStandardTransition(incomingEl, outgoingEl); }, PLAYER_TRANSITION_MS);
    }
    function finishStandardTransition(incomingEl, outgoingEl) {
      incomingEl.style.transition = "none";
      outgoingEl.style.transition = "none";
      outgoingEl.style.opacity = "0";
      outgoingEl.style.transform = "none";
      outgoingEl.style.zIndex = "";
      incomingEl.style.opacity = "1";
      incomingEl.style.transform = "none";
      incomingEl.style.zIndex = "";
      incomingEl.className = "playerSlide active";
      outgoingEl.className = "playerSlide";
    }
    function advanceSlideshow() {
      var nextIndex = (playerIndex + 1) % slides.length;
      var nextSlide = slides[nextIndex];
      var incomingEl = playerActiveIsA ? document.getElementById("playerStageB") : document.getElementById("playerStageA");
      var outgoingEl = playerActiveIsA ? document.getElementById("playerStageA") : document.getElementById("playerStageB");
      renderSlideInto(incomingEl, nextSlide, false);
      var transitionType = nextSlide.transition;

      if (transitionType === "dissolve") {
        incomingEl.className = "playerSlide active";
        incomingEl.style.zIndex = "1";
        outgoingEl.className = "playerSlide active";
        outgoingEl.style.zIndex = "2";
        runDissolveTransition(outgoingEl, incomingEl, function () {
          outgoingEl.className = "playerSlide";
          outgoingEl.style.zIndex = "";
          incomingEl.style.zIndex = "";
        });
      } else {
        applyStandardTransition(transitionType, incomingEl, outgoingEl);
      }

      playerIndex = nextIndex;
      playerActiveIsA = !playerActiveIsA;
      schedulePlayerAdvance();
    }
    function exitSlideshow() {
      if (playerTimer) { clearTimeout(playerTimer); playerTimer = null; }
      document.getElementById("playerScreen").style.display = "none";
    }

    (function () {
      // "isDrawing" here means "drawing is toggled on" (not "button is held") — a click/tap
      // starts the color following the cursor without holding the button down, and clicking
      // again stops it. pointerenter repositions the pen without drawing a stray line across
      // the gap whenever the cursor re-enters the canvas mid-drawing (e.g. after leaving and
      // coming back while still toggled on).
      var canvas = document.getElementById("drawSurface");
      canvas.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        isDrawing = !isDrawing;
        var p = canvasPoint(e, canvas);
        lastDrawX = p.x; lastDrawY = p.y;
        if (isDrawing) {
          drawCtx.fillStyle = drawColor;
          drawCtx.beginPath();
          drawCtx.arc(p.x, p.y, BRUSH_SIZES[drawSizeKey] / 2, 0, Math.PI * 2);
          drawCtx.fill();
        }
      });
      canvas.addEventListener("pointermove", function (e) {
        if (!isDrawing) return;
        var p = canvasPoint(e, canvas);
        drawCtx.strokeStyle = drawColor;
        drawCtx.lineWidth = BRUSH_SIZES[drawSizeKey];
        drawCtx.beginPath();
        drawCtx.moveTo(lastDrawX, lastDrawY);
        drawCtx.lineTo(p.x, p.y);
        drawCtx.stroke();
        lastDrawX = p.x; lastDrawY = p.y;
      });
      canvas.addEventListener("pointerenter", function (e) {
        if (!isDrawing) return;
        var p = canvasPoint(e, canvas);
        lastDrawX = p.x; lastDrawY = p.y;
      });
    })();

    loadProjectsFromStorage();
    loadRecentPhotosFromStorage();

      saveProjectsToStorage();
    }
    loadProject(projects[0].id);
  </script>
